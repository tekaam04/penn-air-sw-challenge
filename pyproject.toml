[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "pennair-shapes"
version = "1.0.0"
description = "Background-agnostic detection of solid shapes, for the PennAiR 2026 software challenge"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = ["opencv-python>=4.8", "numpy>=1.24"]

[project.optional-dependencies]
dev = ["pytest>=7", "pillow>=10"]

[tool.setuptools]
packages = ["pennair"]

[tool.black]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
